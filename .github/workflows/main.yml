name: Build server-parser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --------------------------------------------------------------------
  # Native build: compiles libgpiod v2 from source on the runner, then
  # builds server-parser against it with plain `make`.
  # --------------------------------------------------------------------
  native-build:
    runs-on: ubuntu-24.04

    env:
      GPIOD_VERSION: v2.1.3

    defaults:
      run:
        working-directory: server-parser

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            pkg-config \
            m4

      - name: Cache libgpiod build
        id: cache-gpiod
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/gpiod.h
            /usr/local/include/gpiod
            /usr/local/lib/libgpiod*
            /usr/local/lib/pkgconfig/libgpiod.pc
          key: libgpiod-${{ env.GPIOD_VERSION }}-${{ runner.os }}

      - name: Clone libgpiod
        if: steps.cache-gpiod.outputs.cache-hit != 'true'
        run: |
          git clone https://git.kernel.org/pub/scm/libs/libgpiod/libgpiod.git /tmp/libgpiod
          cd /tmp/libgpiod
          git checkout ${{ env.GPIOD_VERSION }}

      - name: Build and install libgpiod
        if: steps.cache-gpiod.outputs.cache-hit != 'true'
        run: |
          cd /tmp/libgpiod
          ./autogen.sh --enable-tools=yes --prefix=/usr/local
          make -j$(nproc)
          sudo make install

      - name: Refresh linker cache
        run: sudo ldconfig

      - name: Build server-parser
        run: make

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: my_program
          path: server-parser/build/my_program

  # --------------------------------------------------------------------
  # Docker build: builds the multi-stage Dockerfile (libgpiod build
  # stage -> project build stage -> slim runtime stage). Layers are
  # cached in the GitHub Actions cache so libgpiod isn't rebuilt every
  # run unless the Dockerfile or source changes.
  # --------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: server-parser
          file: .github/docker/Dockerfile
          push: false
          tags: my_program:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Optional: push the image to GHCR instead of just building it.
      # Uncomment this block (and remove `push: false` above) if you want
      # the image itself published as a build artifact.
      #
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Build and push image
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: server-parser
      #     file: server-parser/Dockerfile
      #     push: true
      #     tags: ghcr.io/${{ github.repository }}/my_program:latest
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max